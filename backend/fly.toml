# fly.toml app configuration file generated for eloquence-api on 2026-05-23T01:14:33+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'eloquence-api'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'alembic upgrade head'

[env]
  PORT = '8000'
  PYTHONUNBUFFERED = '1'

[http_service]
  internal_port = 8000
  force_https = true
  # 'suspend' (not 'stop') so an idle machine snapshots its RAM instead of
  # fully powering off. Resuming a suspended machine restores that snapshot in
  # well under a second — the word lists + pattern matrix stay loaded — versus
  # the ~10s cold boot a stopped machine pays (Python start + matrix reload +
  # warmup). This kills the "first guess after idle" and "paused mid-game" lag
  # while still scaling to zero (no compute billing while suspended). The very
  # first boot after a deploy is still a full cold start.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    # Pattern matrix + word lists take ~10s to load on first boot, so we give
    # the app a wide grace before the health check counts a failure.
    grace_period = '60s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  # 256MB OOM-kills the worker during pattern matrix build. 512MB has plenty
  # of headroom and is still pennies/month with auto-stop on idle.
  memory_mb = 512
