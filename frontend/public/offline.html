<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#6aaa64" />
  <title>Offline · ELOquence</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1a1b;
      --muted: #787c7e;
      --border: #d3d6da;
      --green: #6aaa64;
      --yellow: #c9b458;
      --gray: #787c7e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121213;
        --fg: #ffffff;
        --muted: #818384;
        --border: #3a3a3c;
        --green: #538d4e;
        --yellow: #b59f3b;
        --gray: #3a3a3c;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Libre Franklin', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .tiles {
      display: grid;
      grid-template-columns: repeat(7, 48px);
      gap: 6px;
      margin-bottom: 28px;
    }
    .tile {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Roboto Slab', Georgia, serif;
      font-weight: 700;
      font-size: 26px;
      color: #ffffff;
      border: 2px solid var(--border);
      text-transform: uppercase;
    }
    .tile.green  { background: var(--green);  border-color: var(--green);  }
    .tile.yellow { background: var(--yellow); border-color: var(--yellow); }
    .tile.gray   { background: var(--gray);   border-color: var(--gray);   }
    h1 {
      font-family: 'Roboto Slab', Georgia, serif;
      font-size: clamp(28px, 6vw, 40px);
      font-weight: 900;
      margin: 0 0 12px;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      max-width: 32ch;
      margin: 0 0 28px;
    }
    button {
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background: var(--green);
      border: 0;
      border-radius: 10px;
      padding: 12px 22px;
      cursor: pointer;
      transition: opacity 150ms ease, transform 120ms ease;
    }
    button:hover { opacity: 0.92; }
    button:active { transform: scale(0.97); }
    .hint {
      margin-top: 18px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="tiles" aria-hidden="true">
      <div class="tile gray">O</div>
      <div class="tile gray">F</div>
      <div class="tile gray">F</div>
      <div class="tile yellow">L</div>
      <div class="tile green">I</div>
      <div class="tile green">N</div>
      <div class="tile green">E</div>
    </div>
    <h1>You're offline</h1>
    <p>ELOquence can't reach the server right now. Reconnect and try again — your progress is safe.</p>
    <button onclick="location.reload()">Try again</button>
    <p class="hint">Tip: pages you've already visited will still open while offline.</p>
  </main>
  <script>
    // As soon as the connection is back, refresh automatically.
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
