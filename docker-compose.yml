version: '3.8'

services:
  db:
    image: postgres:16-alpine
    command: postgres -c timezone=Europe/Zagreb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eloquence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eloquence_dev}
      POSTGRES_DB: ${POSTGRES_DB:-eloquence}
      TZ: Europe/Zagreb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eloquence}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-eloquence}:${POSTGRES_PASSWORD:-eloquence_dev}@db:5432/${POSTGRES_DB:-eloquence}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-eloquence}:${POSTGRES_PASSWORD:-eloquence_dev}@db:5432/${POSTGRES_DB:-eloquence}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      CORS_ORIGINS: http://localhost:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-43178926835-ijupvcom66h7iufnj75i0bdfd0i918bi.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-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}
      TZ: Europe/Zagreb
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_cache:/app/.cache

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-43178926835-ijupvcom66h7iufnj75i0bdfd0i918bi.apps.googleusercontent.com}
      WATCHPACK_POLLING: "true"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  backend_cache:
